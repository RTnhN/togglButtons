[project]
name = "togglbuttons"
version = "0.1.0"
description = "Physical Toggl timer buttons backed by an Arduino button panel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
toggl-buttons = "toggl_buttons:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toggl_buttons"]
